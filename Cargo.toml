[package]
name = "thulli"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
sysinfo = "0.33"
tray-icon = "0.19"
winit = "0.30"

[build-dependencies]
slint-build = "1.18.1"
