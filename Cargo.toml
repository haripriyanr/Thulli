[package]
name = "thulli"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "thulli_core"
path = "src/lib.rs"

[[bin]]
name = "thulli"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
sysinfo = "0.33"
tray-icon = "0.19"
winit = "0.30"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
rand = "0.10.3"
zeroize = "1.9.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_System_Com"] }
raw-window-handle = "0.6"
regex = "1.12"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
global-hotkey = "0.7"
notify-rust = { version = "4", default-features = false }
rfd = "0.16"
ureq = { version = "2", features = ["json"] }
# On-device models: llama.cpp for the planner, ONNX Runtime for speech.
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "ndarray", "half"] }
half = "2"
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
cpal = "0.18"
sha2 = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18.1"

