[package]
name = "thulli"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "thulli_core"
path = "src/lib.rs"

[[bin]]
name = "thulli"
path = "src/main.rs"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
sysinfo = "0.33"
tray-icon = "0.19"
winit = "0.30"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
rand = "0.10.3"
zeroize = "1.9.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
regex = "1.12"
mistralrs = { version = "0.8.1", optional = true }

[build-dependencies]
slint-build = "1.18.1"

[features]
local-model = ["dep:mistralrs"]
