[package]
name = "assistant_eval"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone package: it pulls in the real prompt, action and model source
# files by path, so it builds on Linux (Kaggle) without Slint or Win32.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
ureq = { version = "2", features = ["json"] }
